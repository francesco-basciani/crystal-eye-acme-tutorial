title: Crystal Eye · ACME
author: Crystal Eye tutorial team
copyright: ""
logo: _static/crystal-eye-mark.jpeg
execute:
  execute_notebooks: "off"
exclude_patterns: [_build, README.md, "**/.ipynb_checkpoints", ".DS_Store"]
sphinx:
  config:
    html_show_sourcelink: false
    html_extra_path: [_redirects]
    myst_heading_anchors: 3
    html_js_files:
      - acme-live.js
    thebe_config:
      repository_url: https://github.com/francesco-basciani/crystal-eye-acme-tutorial
      # Pin the prebuilt PyROOT environment. The page sends its own cell code.
      repository_branch: 7dbbc955a57e2f3938e19b1327837fbccc9c8132
      path_to_docs: book
      codemirror-theme: default
